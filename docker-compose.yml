version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chordpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-chordpro_studio}
    volumes:
      - chordpro_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chordpro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-chordpro}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-chordpro_studio}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MUSICIAN_TOKEN_DEFAULT_DAYS: ${MUSICIAN_TOKEN_DEFAULT_DAYS:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-leader@church.org}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change_me_immediately}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Worship Director}
    ports:
      - "3000:3000"

volumes:
  chordpro_pgdata:
